[project]
name = "sofia-parking"
version = "0.1.0"
description = "Daily imot.bg scanner for parking spaces / garages near the center of Sofia"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "litellm>=1.40",
    "folium>=0.17",
]

[project.scripts]
sofia-parking = "sofia_parking.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sofia_parking*"]
